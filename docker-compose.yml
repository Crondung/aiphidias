# Lokaler Stack. Das Zielbild in Produktion (Caddy, Hydra, Login-App) steht in
# docs/deployment.md §1 - hier laeuft nur, was fuer Schritt 1-3 und 6 der
# Baureihenfolge gebraucht wird.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aiphidias
      POSTGRES_PASSWORD: aiphidias
      POSTGRES_DB: aiphidias
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Ungewoehnlicher Port, damit ein lokal laufendes Postgres nicht kollidiert.
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiphidias"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: ./app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aiphidias:aiphidias@postgres:5432/aiphidias
      BLOB_ROOT: /var/lib/aiphidias/blobs
      PUBLIC_BASE_URL: http://localhost:8787
      MCP_BASE_URL: http://localhost:8787
      # Nur lokal vertretbar. In Produktion ueber die .env setzen:
      #   openssl rand -hex 32
      HMAC_SECRET: dev-only-insecure-secret-change-me
      # Identitaet kommt aus einem Header statt aus einem OAuth-Token.
      # Muss aus sein, sobald der Server oeffentlich erreichbar ist.
      DEV_MODE: "true"
    volumes:
      - blobs:/var/lib/aiphidias/blobs
    ports:
      # 8000 ist auf dieser Maschine belegt; der Container bleibt intern bei 8000.
      - "8787:8000"

volumes:
  pgdata:
  blobs:
